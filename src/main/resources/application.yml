server:
  port: 8081

spring:
  application:
    name: taskforge
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/taskforge}
    username: ${DB_USER:forge}
    password: ${DB_PASSWORD:change-me-in-env}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:3600000}

logging:
  level:
    com.taskforge: INFO
