services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskforge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me-in-env}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/taskforge
      DB_USER: forge
      DB_PASSWORD: ${DB_PASSWORD:-change-me-in-env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET env var (Base64, 256-bit+)}
    ports:
      - "8081:8081"

volumes:
  pgdata:
